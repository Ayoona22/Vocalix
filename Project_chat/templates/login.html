<!DOCTYPE html>
<html>
<head>
    <title>Join Chat</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 120px; background-color: #f0f2f5; }
        h2 { color: #333; }
        form { display: inline-block; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px 15px; margin: 10px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h2>Enter your name to join the chat</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Your name" required>
        <button type="submit">Join Chat</button>
    </form>
</body>
</html>
